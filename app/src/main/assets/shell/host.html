<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PocketOffice</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f3f3f3;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #1e1e1e;
        }
      }
      #editor {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="editor" allow="clipboard-read; clipboard-write"></iframe>
    <script src="host.js"></script>
  </body>
</html>
